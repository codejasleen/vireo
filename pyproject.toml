[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vireo-support-pipeline"
version = "0.1.0"
description = "Deterministic cleaning and weekly metrics for Vireo Audio support data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vireo-support = "vireo_support.cli:main"

[tool.setuptools.packages.find]
include = ["vireo_support*"]
